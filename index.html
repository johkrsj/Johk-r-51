<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokh | تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        html, body {
            background-color: #1e1f22 !important;
            color: #ffffff !important;
            margin: 0;
            padding: 0;
        }
        .btn-jokh {
            background: linear-gradient(135deg, #5865f2 0%, #4752c4 100%) !important;
            color: #ffffff !important;
        }
        .btn-jokh:hover {
            background: linear-gradient(135deg, #4752c4 0%, #3b42a4 100%) !important;
        }
        .input-jokh {
            background-color: #2b2d31 !important;
            border: 1px solid rgba(63, 66, 72, 0.4) !important;
            color: #ffffff !important;
        }
        .logo-box {
            background: linear-gradient(135deg, #5865f2 0%, #4752c4 100%) !important;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen px-4 py-6">

    <div class="w-full max-w-sm text-center space-y-8">
        <div class="space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl logo-box text-white text-2xl font-black shadow-lg shadow-black/20">
                J
            </div>
            <h2 class="text-2xl font-black text-white tracking-tight pt-2">تسجيل الدخول إلى Jokh</h2>
        </div>

        <div id="alert-box" class="hidden p-3 rounded-xl text-sm text-center border"></div>

        <form id="login-form" onsubmit="return false;" class="space-y-5 text-right">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1.5 mr-1">البريد الإلكتروني</label>
                    <input id="email" type="email" required class="w-full px-4 py-3.5 input-jokh rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5865f2]/50 text-left" placeholder="your@email.com" dir="ltr">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1.5 mr-1">كلمة المرور</label>
                    <input id="password" type="password" required class="w-full px-4 py-3.5 input-jokh rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5865f2]/50 text-left" placeholder="••••••••" dir="ltr">
                </div>
            </div>

            <div class="pt-2">
                <button type="button" id="submit-btn" class="w-full py-3.5 px-4 rounded-xl text-white font-bold btn-jokh transition-all duration-200 transform active:scale-95 shadow-md">
                    دخول
                </button>
            </div>
        </form>

        <div class="pt-2">
            <a href="register.html" class="text-sm font-bold text-[#5865f2] hover:text-[#4752c4] underline">
                إنشاء حساب جديد
            </a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wbmfscfylbghwunvpskv.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndibWZzY2Z5bGJnaHd1bnZwc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDI5MTMxMzUsImV4cCI6MjA1ODQ4OTEzNX0.b8nK6w5DAtx6K8_AmsD9pndfBvD-gZREhT-T3yJ9Aaw";
        
        let supabase;
        const submitBtn = document.getElementById('submit-btn');
        const alertBox = document.getElementById('alert-box');

        function showAlert(message, isError = true) {
            alertBox.innerText = message;
            if (isError) {
                alertBox.className = "p-3 rounded-xl text-sm text-center border block bg-rose-950/30 text-rose-400 border-rose-500/20";
            } else {
                alertBox.className = "p-3 rounded-xl text-sm text-center border block bg-emerald-950/30 text-emerald-400 border-emerald-500/20";
            }
        }

        try {
            supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (err) {
            showAlert("فشل تحميل نظام سوبابيس الأساسي.");
        }

        window.addEventListener('load', async () => {
            if (!supabase) return;
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) { window.location.replace("home.html"); }
            } catch (e) {}
        });

        submitBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            
            if (!supabase) {
                showAlert("النظام غير جاهز، أعد تحميل الصفحة.");
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert("الرجاء تعبئة جميع الحقول أولاً.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الدخول...";
            alertBox.classList.add('hidden');

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                
                if (error) {
                    let errorMsg = "فشل تسجيل الدخول: ";
                    if (error.message === "Invalid login credentials") {
                        errorMsg += "الإيميل أو الباسورد غلط.";
                    } else if (error.message === "Email not confirmed") {
                        errorMsg += "تأكد من تفعيل الحساب من إيميلك أولاً.";
                    } else {
                        errorMsg += error.message;
                    }
                    showAlert(errorMsg, true);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "دخول";
                } else if (data.session) {
                    showAlert("تم الدخول بنجاح! جاري التوجيه...", false);
                    setTimeout(() => { window.location.replace("home.html"); }, 400);
                }
            } catch (err) {
                showAlert("خطأ في الاتصال: " + err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "دخول";
            }
        });
    </script>
</body>
</html>
