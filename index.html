<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* لون موفي داكن ملكي موحد للخلفية بالكامل */
        body {
            background-color: #0b0c16;
            font-family: system-ui, -apple-system, sans-serif;
        }
        /* تدرج الأزرار بالأزرق والموفي الفخم */
        .btn-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
        }
        /* تدرج النص للشعار */
        .text-gradient {
            background: linear-gradient(135deg, #60a5fa, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen px-4">

    <div class="w-full max-w-sm text-center space-y-8">
        <div class="space-y-3">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl btn-gradient text-white text-2xl font-black shadow-lg shadow-indigo-500/10">
                J
            </div>
            <h2 class="text-3xl font-black text-white tracking-tight"><span class="text-gradient">Jokh</span></h2>
            <p id="sub-title" class="text-sm text-gray-400">يسعدنا حضورك، خانتك بانتظارك لتكمل الرحلة</p>
        </div>

        <div id="alert-box" class="hidden p-3 rounded-xl text-sm text-center border"></div>

        <form id="auth-form" class="space-y-5 text-right">
            <div class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-400 mb-1.5 mr-1">البريد الإلكتروني</label>
                    <input id="email" name="email" type="email" required 
                        class="w-full px-4 py-3.5 bg-gray-900/80 border border-gray-800 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-left" 
                        placeholder="your@email.com" dir="ltr">
                </div>
                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-400 mb-1.5 mr-1">كلمة المرور</label>
                    <input id="password" name="password" type="password" required 
                        class="w-full px-4 py-3.5 bg-gray-900/80 border border-gray-800 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-left" 
                        placeholder="••••••••" dir="ltr">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" id="submit-btn" class="w-full py-3.5 px-4 rounded-xl text-white font-bold btn-gradient transition-all duration-200 transform active:scale-95 shadow-md">
                    دخول
                </button>
            </div>
        </form>

        <div class="pt-2">
            <p class="text-xs text-gray-500">
                <span id="toggle-text">جديد معنا؟</span>
                <button id="toggle-btn" class="font-bold text-indigo-400 hover:text-indigo-300 focus:outline-none underline mr-1">
                    البدء من هنا
                </button>
            </p>
        </div>
    </div>

    <script>
        // إعدادات Supabase
        const SUPABASE_URL = "https://wbmfscfylbghwunvpskv.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndibWZzY2Z5bGJnaHd1bnZwc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDI5MTMxMzUsImV4cCI6MjA1ODQ4OTEzNX0.b8nK6w5DAtx6K8_AmsD9pndfBvD-gZREhT-T3yJ9Aaw";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('auth-form');
        const submitBtn = document.getElementById('submit-btn');
        const toggleBtn = document.getElementById('toggle-btn');
        const toggleText = document.getElementById('toggle-text');
        const subTitle = document.getElementById('sub-title');
        const alertBox = document.getElementById('alert-box');

        let isLoginMode = true;

        function showAlert(message, isSuccess = false) {
            alertBox.innerText = message;
            alertBox.className = `p-3 rounded-xl text-sm text-center border block ${
                isSuccess 
                ? 'bg-emerald-950/30 text-emerald-400 border-emerald-500/20' 
                : 'bg-rose-950/30 text-rose-400 border-rose-500/20'
            }`;
        }

        // التبديل السلس بين الدخول والتسجيل
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            
            if (isLoginMode) {
                submitBtn.innerText = "دخول";
                toggleBtn.innerText = "البدء من هنا";
                toggleText.innerText = "جديد معنا؟";
                subTitle.innerText = "يسعدنا حضورك، خانتك بانتظارك لتكمل الرحلة";
            } else {
                submitBtn.innerText = "انطلاق";
                toggleBtn.innerText = "لديك حساب؟";
                toggleText.innerText = "مسجل مسبقاً؟";
                subTitle.innerText = "مساحتك الخاصة جاهزة، لتبدأ معنا خطوة جديدة";
            }
            alertBox.classList.add('hidden');
        });

        // إرسال البيانات للـ Supabase
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if(!email || !password) {
                showAlert("فضلاً، أكمل الحقول الأساسية.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = isLoginMode ? "جاري الدخول..." : "جاري التجهيز...";

            if (isLoginMode) {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                
                if (error) {
                    showAlert(error.message, false);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "دخول";
                } else {
                    showAlert("مرحباً بك! ننتقل الآن إلى صفحتك...", true);
                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 1200);
                }
            } else {
                const { data, error } = await supabase.auth.signUp({ email, password });
                
                if (error) {
                    showAlert(error.message, false);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "انطلاق";
                } else {
                    showAlert("تمت الخطوة بنجاح! تفقد بريدك الإلكتروني لتأكيد الرابط وتفعيل حسابك تلقائياً.", true);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "انطلاق";
                }
            }
        });
    </script>
</body>
</html>
