<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokh - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #121214 0%, #1a1525 100%);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-[#16151a] border border-[#26242e] rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        
        <!-- Logo & Branding -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-tr from-[#8b5cf6] to-[#ec4899] rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-[#8b5cf6]/20 mb-3">
                <span class="text-white font-black text-2xl tracking-wider">J</span>
            </div>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#8b5cf6] to-[#ec4899]" id="page-title">Jokh</h1>
            <p class="text-gray-400 text-sm mt-2" id="page-subtitle">شارك لحظاتك مع العالم</p>
        </div>

        <!-- Notification Alert -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-sm text-center border"></div>

        <!-- Authentication Form -->
        <form id="auth-form" class="space-y-5">
            <div>
                <label class="block text-gray-400 text-xs font-semibold mb-2 pr-1">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full bg-[#1c1a22] border border-[#2d2a36] text-white rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-[#8b5cf6] transition-colors placeholder-gray-600" placeholder="your@email.com">
            </div>

            <div>
                <label class="block text-gray-400 text-xs font-semibold mb-2 pr-1">كلمة المرور</label>
                <input type="password" id="password" required class="w-full bg-[#1c1a22] border border-[#2d2a36] text-white rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-[#8b5cf6] transition-colors placeholder-gray-600" placeholder="••••••••">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-[#8b5cf6] to-[#ec4899] text-white font-bold py-4 rounded-xl shadow-lg shadow-[#8b5cf6]/20 hover:opacity-90 active:scale-[0.99] transition-all text-sm mt-2">
                تسجيل الدخول
            </button>
        </form>

        <!-- Toggle Mode Link -->
        <div class="text-center mt-6 pt-6 border-t border-[#222029]">
            <p class="text-gray-400 text-xs" id="toggle-text">
                ما عندك حساب؟ 
                <button type="button" onclick="toggleMode()" class="text-[#8b5cf6] font-bold hover:underline focus:outline-none mr-1">سجّل الآن</button>
            </p>
        </div>

    </div>

    <script>
        // Supabase Configurations
        const SUPABASE_URL = "https://xdpoezreponxbrgpafrr.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_LOokJbfymtO2Vc8ibWlHMw_HlRBAsws";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = true;
        const form = document.getElementById('auth-form');
        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const toggleText = document.getElementById('toggle-text');
        const alertBox = document.getElementById('alert-box');

        // Toggle between Login and Sign Up
        function toggleMode() {
            isLoginMode = !isLoginMode;
            showAlert('', true); // Clear alerts
            
            if (isLoginMode) {
                pageSubtitle.innerText = "شارك لحظاتك مع العالم";
                submitBtn.innerText = "تسجيل الدخول";
                toggleText.innerHTML = `ما عندك حساب؟ <button type="button" onclick="toggleMode()" class="text-[#8b5cf6] font-bold hover:underline focus:outline-none mr-1">سجّل الآن</button>`;
            } else {
                pageSubtitle.innerText = "أنشئ حسابك الفخم الآن في جوخ";
                submitBtn.innerText = "إنشاء حساب جديد";
                toggleText.innerHTML = `عندك حساب بالفعل؟ <button type="button" onclick="toggleMode()" class="text-[#8b5cf6] font-bold hover:underline focus:outline-none mr-1">سجيل الدخول</button>`;
            }
        }

        // Helper function to show alert feedback
        function showAlert(message, clear = false) {
            if (clear) {
                alertBox.className = "hidden";
                return;
            }
            alertBox.className = isLoginMode ? "mb-4 p-3 rounded-xl text-sm text-center border bg-red-950/30 border-red-800 text-red-400" : "mb-4 p-3 rounded-xl text-sm text-center border bg-emerald-950/30 border-emerald-800 text-emerald-400";
            alertBox.innerText = message;
        }

        // Form Submit Handler (Login / Sign Up Action)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            showAlert('', true);
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isLoginMode) {
                // Log In Logic
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    showAlert(error.message);
                } else {
                    alert("تم تسجيل الدخول بنجاح يا رئيس! الخطوة الجاية بنحولك على الهوم.");
                    console.log(data);
                }
            } else {
                // Sign Up Logic
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    showAlert(error.message);
                } else {
                    showAlert("تم إنشاء الحساب بنجاح! تفقد بريدك الإلكتروني لتأكيد الحساب، وسيتم تفعيل البروفايل تلقائياً.");
                    console.log(data);
                }
            }
        });
    </script>
</body>
</html>
