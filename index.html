<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokh | دخول</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0d1117;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .jokh-card {
            background: rgba(22, 28, 36, 0.95);
            border: 1px solid rgba(99, 102, 241, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        /* درجات الأزرق الموفي الفخم */
        .btn-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 50%, #4f46e5 100%);
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
        }
        .text-gradient {
            background: linear-gradient(135deg, #60a5fa, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4 py-12 sm:px-6 lg:px-8">

    <div class="w-full max-w-md p-8 rounded-2xl jokh-card">
        <!-- الشعار والعنوان -->
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 mb-4 rounded-xl btn-gradient text-white text-3xl font-black shadow-lg shadow-indigo-500/20">
                J
            </div>
            <h2 class="text-3xl font-extrabold text-white tracking-tight">منصة <span class="text-gradient">Jokh</span></h2>
            <p id="sub-title" class="mt-2 text-sm text-gray-400">مرحباً بك مجدداً، سجل دخولك للمتابعة</p>
        </div>

        <!-- التنبيه الأمني الذكي -->
        <div id="alert-box" class="hidden mt-4 p-3 rounded-lg text-sm text-center border"></div>

        <!-- النموذج -->
        <form id="auth-form" class="mt-8 space-y-6">
            <div class="space-y-4 rounded-md shadow-sm">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-1">البريد الإلكتروني</label>
                    <input id="email" name="email" type="email" required 
                        class="w-full px-4 py-3 bg-gray-900/50 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-left" 
                        placeholder="your@email.com" dir="ltr">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-1">كلمة المرور</label>
                    <input id="password" name="password" type="password" required 
                        class="w-full px-4 py-3 bg-gray-900/50 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-left" 
                        placeholder="••••••••" dir="ltr">
                </div>
            </div>

            <div>
                <button type="submit" id="submit-btn" class="w-full py-3.5 px-4 rounded-xl text-white font-medium btn-gradient focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200 transform active:scale-95 shadow-lg shadow-indigo-500/10">
                    تسجيل الدخول
                </button>
            </div>
        </form>

        <!-- تحويل الوضع (تسجيل / إنشاء) -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-400">
                <span id="toggle-text">ليس لديك حساب؟</span>
                <button id="toggle-btn" class="font-medium text-indigo-400 hover:text-indigo-300 focus:outline-none underline mr-1">
                    إنشاء حساب الآن
                </button>
            </p>
        </div>
    </div>

    <script>
        // إعدادات Supabase (مربوطة بقاعدتك وجداولك بأمان)
        const SUPABASE_URL = "https://wbmfscfylbghwunvpskv.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndibWZzY2Z5bGJnaHd1bnZwc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDI5MTMxMzUsImV4cCI6MjA1ODQ4OTEzNX0.b8nK6w5DAtx6K8_AmsD9pndfBvD-gZREhT-T3yJ9Aaw";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('auth-form');
        const submitBtn = document.getElementById('submit-btn');
        const toggleBtn = document.getElementById('toggle-btn');
        const toggleText = document.getElementById('toggle-text');
        const subTitle = document.getElementById('sub-title');
        const alertBox = document.getElementById('alert-box');

        let isLoginMode = true;

        // دالة إظهار التنبيهات الفورية
        function showAlert(message, isSuccess = false) {
            alertBox.innerText = message;
            alertBox.className = `mt-4 p-3 rounded-lg text-sm text-center border block ${
                isSuccess 
                ? 'bg-emerald-950/40 text-emerald-400 border-emerald-500/30' 
                : 'bg-rose-950/40 text-rose-400 border-rose-500/30'
            }`;
        }

        // التبديل بين وضع الدخول ووضع إنشاء الحساب
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault(); // منع أي تعليق في المتصفح
            isLoginMode = !isLoginMode;
            
            if (isLoginMode) {
                submitBtn.innerText = "تسجيل الدخول";
                toggleBtn.innerText = "إنشاء حساب الآن";
                toggleText.innerText = "ليس لديك حساب؟";
                subTitle.innerText = "مرحباً بك مجدداً، سجل دخولك للمتابعة";
            } else {
                submitBtn.innerText = "إنشاء الحساب الجديد";
                toggleBtn.innerText = "تسجيل الدخول";
                toggleText.innerText = "لديك حساب بالفعل؟";
                subTitle.innerText = "انضم إلى Jokh واكتشف عالمك الإبداعي";
            }
            alertBox.classList.add('hidden'); // إخفاء التنبيهات القديمة عند التبديل
        });

        // إرسال البيانات للـ Supabase
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if(!email || !password) {
                showAlert("الرجاء تعبئة جميع الحقول المطلوبة.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = isLoginMode ? "جاري الدخول..." : "جاري إنشاء الحساب...";

            if (isLoginMode) {
                // منطق تسجيل الدخول
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                
                if (error) {
                    showAlert(error.message, false);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "تسجيل الدخول";
                } else {
                    showAlert("تم تسجيل الدخول بنجاح! جاري تحويلك للهوم...", true);
                    // هنا سينتقل تلقائياً لصفحة الهوم فور رفعها الخطوة القادمة
                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 1500);
                }
            } else {
                // منطق إنشاء حساب جديد
                const { data, error } = await supabase.auth.signUp({ email, password });
                
                if (error) {
                    showAlert(error.message, false);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "إنشاء الحساب الجديد";
                } else {
                    showAlert("تم إنشاء الحساب! تفقد بريدك الإلكتروني لتأكيد الحساب وتفعيله تلقائياً.", true);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "إنشاء الحساب الجديد";
                }
            }
        });
    </script>
</body>
</html>
