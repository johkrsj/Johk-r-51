<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokh | إنشاء حساب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="flex flex-col items-center justify-center min-h-screen px-4 py-6">

    <div class="w-full max-w-sm text-center space-y-6">
        <div class="space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl logo-box text-white text-2xl font-black shadow-lg shadow-black/20">
                J
            </div>
            <h2 class="text-2xl font-black text-white tracking-tight pt-1">إنشاء حساب في Jokh</h2>
        </div>

        <div id="alert-box" class="hidden p-3 rounded-xl text-sm text-center border"></div>

        <form id="register-form" class="space-y-4 text-right">
            <div class="space-y-3">
                <div>
                    <label for="display-name" class="block text-xs font-semibold text-gray-400 mb-1 mr-1">الاسم</label>
                    <input id="display-name" type="text" required class="w-full px-4 py-3 bg-[#2b2d31] border border-[#3f4248]/40 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-[#5865f2]/50 text-right" placeholder="الاسم">
                </div>

                <div>
                    <label for="username" class="block text-xs font-semibold text-gray-400 mb-1 mr-1">اسم المستخدم (اليوزر)</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-gray-500 font-bold font-mono">@</span>
                        <input id="username" type="text" required class="w-full pl-8 pr-4 py-3 bg-[#2b2d31] border border-[#3f4248]/40 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-[#5865f2]/50 text-left font-mono" placeholder="username" dir="ltr">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-400 mb-1 mr-1">البريد الإلكتروني</label>
                    <input id="email" type="email" required class="w-full px-4 py-3 bg-[#2b2d31] border border-[#3f4248]/40 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-[#5865f2]/50 text-left" placeholder="your@email.com" dir="ltr">
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-400 mb-1 mr-1">كلمة المرور</label>
                    <input id="password" type="password" required class="w-full px-4 py-3 bg-[#2b2d31] border border-[#3f4248]/40 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-[#5865f2]/50 text-left" placeholder="••••••••" dir="ltr">
                </div>

                <div>
                    <label for="confirm-password" class="block text-xs font-semibold text-gray-400 mb-1 mr-1">تأكيد كلمة المرور</label>
                    <input id="confirm-password" type="password" required class="w-full px-4 py-3 bg-[#2b2d31] border border-[#3f4248]/40 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-[#5865f2]/50 text-left" placeholder="••••••••" dir="ltr">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" id="submit-btn" class="w-full py-3.5 px-4 rounded-xl text-white font-bold btn-jokh transition-all duration-200 transform active:scale-95 shadow-md">
                    إنشاء
                </button>
            </div>
        </form>

        <div class="pt-1">
            <a href="index.html" class="text-sm font-bold text-[#5865f2] hover:text-[#4752c4] underline">
                لديك حساب بالفعل؟ تسجيل دخول
            </a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wbmfscfylbghwunvpskv.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndibWZzY2Z5bGJnaHd1bnZwc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDI5MTMxMzUsImV4cCI6MjA1ODQ4OTEzNX0.b8nK6w5DAtx6K8_AmsD9pndfBvD-gZREhT-T3yJ9Aaw";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('register-form');
        const submitBtn = document.getElementById('submit-btn');
        const alertBox = document.getElementById('alert-box');

        function displayAlert(message, isSuccess = false) {
            alertBox.innerText = message;
            alertBox.className = `p-3 rounded-xl text-sm text-center border block ${isSuccess ? 'bg-emerald-950/30 text-emerald-400 border-emerald-500/20' : 'bg-rose-950/30 text-rose-400 border-rose-500/20'}`;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const displayName = document.getElementById('display-name').value.trim();
            const username = document.getElementById('username').value.trim().toLowerCase();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                displayAlert("خطأ: كلمتا المرور غير متطابقتين!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الإنشاء...";

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: { data: { full_name: displayName, user_name: username } }
            });
            
            if (error) {
                displayAlert(error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "إنشاء";
            } else {
                displayAlert("تم إنشاء الحساب بنجاح! تفقد بريدك الإلكتروني لتأكيد الحساب والتحقق.", true);
                form.reset();
                submitBtn.disabled = false;
                submitBtn.innerText = "إنشاء";
            }
        });
    </script>
</body>
</html>
