<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokh | الملف الشخصي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #1e1f22; font-family: system-ui, -apple-system, sans-serif; }
        .btn-gradient { background: linear-gradient(135deg, #5865f2 0%, #4752c4 100%); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen px-4 py-6">

    <div id="profile-card" class="hidden w-full max-w-sm space-y-6 text-center">
        <div class="space-y-1">
            <h2 class="text-2xl font-black text-white">الملف الشخصي</h2>
            <p id="welcome-name" class="text-xs text-gray-400">مرحباً بك في Jokh</p>
        </div>

        <div class="space-y-6 pt-4">
            <div class="relative inline-block">
                <div class="w-24 h-24 rounded-full btn-gradient p-1 shadow-xl mx-auto flex items-center justify-center">
                    <div id="avatar-letter" class="w-full h-full bg-[#1e1f22] rounded-full flex items-center justify-center text-white text-3xl font-black">
                        J
                    </div>
                </div>
                <span class="absolute bottom-0 right-1/2 translate-x-10 bg-[#5865f2] text-[10px] text-white px-2 py-0.5 rounded-full font-bold">مبدع</span>
            </div>

            <div class="text-right space-y-4 max-w-xs mx-auto">
                <div>
                    <span class="block text-xs font-semibold text-gray-400 mb-1">البريد الإلكتروني</span>
                    <div id="user-email" class="w-full px-4 py-3 bg-[#2b2d31] border border-[#3f4248]/40 rounded-xl text-gray-300 text-left" dir="ltr">
                        ---
                    </div>
                </div>
                <div>
                    <span class="block text-xs font-semibold text-gray-400 mb-1">اسم المستخدم (اليوزر)</span>
                    <div id="user-username" class="w-full px-4 py-3 bg-[#2b2d31] border border-[#3f4248]/40 rounded-xl text-gray-300 text-left font-mono" dir="ltr">
                        ---
                    </div>
                </div>
            </div>

            <div class="pt-4 max-w-xs mx-auto">
                <button id="logout-btn" class="w-full py-3 px-4 text-center rounded-xl text-sm font-bold bg-[#2b2d31] text-gray-300 border border-[#3f4248]/60 hover:bg-[#313338] transition-all">
                    تسجيل الخروج
                </button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wbmfscfylbghwunvpskv.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndibWZzY2Z5bGJnaHd1bnZwc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDI5MTMxMzUsImV4cCI6MjA1ODQ4OTEzNX0.b8nK6w5DAtx6K8_AmsD9pndfBvD-gZREhT-T3yJ9Aaw";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // التحقق عند فتح الملف الشخصي وطرد غير المسجلين وحفظ الكوكيز
        window.addEventListener('load', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) {
                // إذا حاول يدخل بدون كوكيز أو سيشن، يرجع لصفحة الدخول
                window.location.href = "index.html";
            } else {
                // سحب البيانات وعرضها فوراً بشكل ديناميكي فخم
                const user = session.user;
                document.getElementById('user-email').innerText = user.email;
                
                const fullName = user.user_metadata?.full_name || "عضو Jokh";
                const uName = user.user_metadata?.user_name || "---";
                
                document.getElementById('welcome-name').innerText = `مرحباً بك يا ${fullName}`;
                document.getElementById('user-username').innerText = `@${uName}`;
                document.getElementById('avatar-letter').innerText = fullName.charAt(0).toUpperCase();
                
                document.getElementById('profile-card').classList.remove('hidden');
            }
        });

        // تفعيل زر تسجيل الخروج الحقيقي لمسح الكوكيز والسيشن
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
